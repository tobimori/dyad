packages:
  - apps/*
  - packages/*
  - plugins/*

catalog:
  effect: 4.0.5
  "@effect/platform-node": 4.0.5
  "@effect/platform-browser": 4.0.5
  "@effect/sql-sqlite-node": 4.0.5
  "@effect/sql-sqlite-wasm": 4.0.5
  "@effect/atom-react": 4.0.5
  "@effect/tsgo": 0.53.3
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  "@opentui/core": 0.6.6
  "@opentui/keymap": 0.6.6
  "@opentui/react": 0.6.6
  "@tanstack/react-router": 1.170.45
  "@tanstack/react-start": 1.169.3
  "@stylexjs/stylex": 0.19.1
  "@stylexjs/unplugin": 0.19.1
  drizzle-orm: 1.0.0-rc.5-5935859
  drizzle-kit: 1.0.0-rc.5-5935859
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 7.0.2
  vite-plus: 1.3.0
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  unplugin: 2.3.11
  portless: 0.15.8
  env-paths: 4.0.0
  node-av: 6.1.1
  "@li0ard/widevine": 0.1.6
  fractional-indexing: 3.2.0

overrides:
  "vite@*": npm:@voidzero-dev/vite-plus-core@1.3.0
  # Widevine 0.1.6 calls `cmac(key, message)`; noble-ciphers 2.4.0 reverses these arguments
  "@li0ard/widevine@0.1.6>@noble/ciphers": 2.1.1

# Vite+ core reports the toolchain version while implementing Vite 8.
peerDependencyRules:
  allowedVersions:
    "@vitest/mocker>vite": 1.3.0
    "vitest>vite": 1.3.0
    "@tanstack/react-start>vite": 1.3.0
    "@tanstack/start-plugin-core>vite": 1.3.0
    "@tanstack/router-plugin>vite": 1.3.0
    "@vitejs/plugin-react>vite": 1.3.0
    "vitefu>vite": 1.3.0

allowBuilds:
  better-sqlite3: true
  # The prebuilt binary is an optional dependency. The scripts only download an unused `ffmpeg` binary.
  node-av: false
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - "@effect/tsgo-darwin-arm64@0.53.3"
  - "@effect/tsgo-darwin-x64@0.53.3"
  - "@effect/tsgo-linux-arm64@0.53.3"
  - "@effect/tsgo-linux-arm@0.53.3"
  - "@effect/tsgo-linux-x64@0.53.3"
  - "@effect/tsgo-win32-arm64@0.53.3"
  - "@effect/tsgo-win32-x64@0.53.3"
  - "@effect/tsgo@0.53.3"
  - "@tanstack/react-router@1.170.45"
  - "@tanstack/react-start-client@1.168.43"
  - "@tanstack/react-start-rsc@0.1.64"
  - "@tanstack/react-start-server@1.167.51"
  - "@tanstack/react-start@1.169.3"
  - "@tanstack/router-core@1.171.38"
  - "@tanstack/router-generator@1.167.45"
  - "@tanstack/router-plugin@1.168.47"
  - "@tanstack/start-client-core@1.170.38"
  - "@tanstack/start-plugin-core@1.171.54"
  - "@tanstack/start-server-core@1.169.44"
  - "@tanstack/start-storage-context@1.167.40"

patchedDependencies:
  drizzle-orm@1.0.0-rc.5-5935859: patches/drizzle-orm@1.0.0-rc.5-5935859.patch
