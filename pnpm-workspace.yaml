packages:
  - apps/*
  - packages/*

catalog:
  effect: 4.0.0-rc.117
  "@effect/platform-node": 4.0.0-rc.117
  "@effect/platform-browser": 4.0.0-rc.117
  "@effect/sql-sqlite-node": 4.0.0-rc.117
  "@effect/sql-sqlite-wasm": 4.0.0-rc.117
  "@effect/atom-react": 4.0.0-rc.117
  "@effect/tsgo": 0.47.1
  "@types/node": 24.13.6
  "@types/react": 19.2.0
  "@types/react-dom": 19.2.0
  "@vitejs/plugin-react": 6.1.1
  "@tanstack/react-router": 1.170.41
  "@tanstack/react-start": 1.168.60
  "@stylexjs/stylex": 0.19.1
  "@stylexjs/unplugin": 0.19.1
  drizzle-orm: 1.0.0-rc.5-ab785fc
  drizzle-kit: 1.0.0-rc.5-ab785fc
  react: 19.2.0
  react-dom: 19.2.0
  typescript: 7.0.2
  vite-plus: 1.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  unplugin: 2.3.11
  portless: 0.15.6
  env-paths: 3.0.0

# Effect prereleases must stay aligned, including transitive platform packages.
overrides:
  "@effect/platform-node-shared": 4.0.0-rc.117
  "vite@*": npm:@voidzero-dev/vite-plus-core@1.0.0

# Vite+ core reports the toolchain version while implementing Vite 8.
peerDependencyRules:
  allowedVersions:
    "@vitest/mocker>vite": 1.0.0
    "vitest>vite": 1.0.0
    "@tanstack/react-start>vite": 1.0.0
    "@tanstack/start-plugin-core>vite": 1.0.0
    "@tanstack/router-plugin>vite": 1.0.0
    "@vitejs/plugin-react>vite": 1.0.0
    "vitefu>vite": 1.0.0

allowBuilds:
  better-sqlite3: true
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - effect@4.0.0-rc.117
  - "@effect/platform-node@4.0.0-rc.117"
  - "@effect/platform-node-shared@4.0.0-rc.117"
  - "@effect/platform-browser@4.0.0-rc.117"
  - "@effect/sql-sqlite-node@4.0.0-rc.117"
  - "@effect/sql-sqlite-wasm@4.0.0-rc.117"
  - "@effect/atom-react@4.0.0-rc.117"
  - drizzle-orm@1.0.0-rc.5-ab785fc
  - drizzle-kit@1.0.0-rc.5-ab785fc
  - "@effect/tsgo-darwin-arm64@0.47.1"
  - "@effect/tsgo-darwin-x64@0.47.1"
  - "@effect/tsgo-linux-arm64@0.47.1"
  - "@effect/tsgo-linux-arm@0.47.1"
  - "@effect/tsgo-linux-x64@0.47.1"
  - "@effect/tsgo-win32-arm64@0.47.1"
  - "@effect/tsgo-win32-x64@0.47.1"
  - "@effect/tsgo@0.47.1"
  - "@tanstack/react-router@1.170.41"
  - "@tanstack/react-start-client@1.168.39"
  - "@tanstack/react-start-rsc@0.1.59"
  - "@tanstack/react-start-server@1.167.46"
  - "@tanstack/react-start@1.168.60"
  - "@tanstack/router-core@1.171.34"
  - "@tanstack/router-generator@1.167.40"
